# A tag matching v* runs the full gate and the mutation gate, builds
# dist/cis_libs-<version>.zip, and attaches it to a *draft* GitHub release.
# Publishing the draft is a manual step.

name: release

on:
  push:
    tags: ['v*']

# Read-only by default; the one job that creates the release asks for write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  LUACHECK_VERSION: 1.2.0

jobs:
  release:
    name: draft release
    # A literal: `runs-on` cannot read the `env` context.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match package.json
        # A v1.0.1 tag on a tree whose package.json still says 1.0.0 would
        # build cis_libs-1.0.0.zip and attach it to a release called v1.0.1.
        # docs-check (inside the full gate) already ties package.json to
        # fxmanifest.lua and the docs; this ties the TAG to all of them.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version v${VERSION}"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Lua 5.4 and luacheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4 luarocks
          sudo luarocks install luacheck "$LUACHECK_VERSION"
          lua5.4 -v

      - name: Full gate
        run: npm run test:all

      - name: Mutation gate
        run: npm run test:mutate

      - name: Attach draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          ZIP="dist/cis_libs-${VERSION}.zip"
          test -f "$ZIP"
          sha256sum "$ZIP"
          gh release create "${GITHUB_REF_NAME}" "$ZIP" \
            --draft \
            --title "cis_libs ${VERSION}" \
            --notes "Draft. Contract api=1. See CHANGELOG.md."
