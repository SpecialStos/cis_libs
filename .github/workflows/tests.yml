name: tests

# Everything the repository gates on, in one script, so a local `npm run
# test:all` and this workflow cannot drift. If a step here is not reachable
# from that script, it is a step somebody has to remember to run.
#
# The mutation gate is the exception and runs in its own job, because it copies
# the tree and runs the suite once per mutation: minutes rather than seconds,
# which is too slow to sit in front of every push but too important to leave to
# a nightly nobody reads.
#
# Every action is pinned by full commit SHA, with the tag it was taken from in a
# trailing comment, so a moved or compromised tag cannot change what runs here.
# To update one: git ls-remote --tags <repo> <tag>, take the commit (peel an
# annotated tag with ^{}), and change the SHA and the comment together.
#
# The live server tier is the other exception: it boots a real FXServer, so it
# needs the FIVEM_LICENSE_KEY secret, and a run without one (a fork's pull
# request) skips it with a notice rather than failing.

on:
  # Pushes to main only. A branch with a pull request is tested by the
  # pull_request event; listening to pushes on every branch as well ran the
  # whole gate twice for each commit on a PR branch.
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, so a FiveM release that changes the natives cannot sit unnoticed
    # until the next unrelated change happens to touch a native.
    - cron: '17 4 * * *'
  workflow_dispatch:

# Read-only token. Nothing in this workflow writes to the repository.
permissions:
  contents: read

# Superseded runs are cancelled rather than queued: ten pushes to a pull
# request should cost the last one, not all ten. Keyed on the PR number when
# there is one, so a PR's runs share a group whatever ref the event names.
# The nightly run has a group of its own: its ref is main, the same as a push to
# main, and a push would otherwise cancel the one run whose job is to notice a
# FiveM release that changed the natives.
concurrency:
  group: tests-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  # luacheck 1.2.0 exactly. The lint result is part of the release gate, so a
  # floating version means the gate means something different each month.
  LUACHECK_VERSION: 1.2.0

jobs:
  test:
    name: full gate (lint, realms, suites on two interpreters, api, generated files)
    # Pinned on purpose, and written as a literal: `runs-on` is evaluated
    # before the `env` context exists, so `${{ env.RUNNER }}` here is an
    # error and the workflow never starts. `ubuntu-latest` moved under this
    # file before, and a green run on two different images is not evidence
    # about either of them.
    runs-on: ubuntu-24.04
    # test:all takes a few minutes. A hang is reported by the timeout, not by
    # six hours of runner time.
    timeout-minutes: 30
    steps:
      # v7 is the newest major of both actions (git ls-remote --tags, 2026-10).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Lua 5.4
        # The suites run under BOTH fengari and a real interpreter. Task 1.7
        # found a seeded-RNG defect that only exists on a real one, so this is
        # a correctness gate rather than a belt-and-braces extra. With CI set,
        # test:lua54 FAILS when no interpreter is found instead of skipping.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          lua5.4 -v

      - name: Install luacheck
        # luarocks, not apt: the apt package tracks whatever Ubuntu ships, and
        # this repository's lint result is only meaningful at a known version.
        run: |
          sudo apt-get install -y -qq luarocks
          sudo luarocks install luacheck "$LUACHECK_VERSION"
          luacheck --version | head -1

      - name: Run the full gate
        # lint, generated-luacheck check, realm check, syntax, the suite under
        # fengari, the same suite under Lua 5.4, the api validator and its own
        # selftest, the generated-file check, docs, and the package build.
        run: npm run test:all

  mutate:
    name: mutation gate (every known defect must break the suite)
    runs-on: ubuntu-24.04
    # Not on every push: it copies the tree and runs the suite once per row.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    # One full suite run per mutation row: minutes, and it grows with the rows.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply every mutation and require the suite to fail
        # A mutation that still passes is a SURVIVOR and means the check it was
        # written for does not exist. A row whose find no longer matches is
        # STALE and means it stopped testing anything. Both fail the build.
        run: npm run test:mutate

  live-server:
    name: live server tier (real headless FXServer, no game client)
    # The suites above run under fengari and Lua 5.4 against hand-written native
    # stubs. This job runs the live harness (test/live/) on a REAL FXServer: the
    # server and lifecycle tiers, which need no player. It is the only check in
    # this file whose natives are FiveM's own. See test/live/RUNBOOK.md, "CI".
    runs-on: ubuntu-24.04
    # Download (cached), boot, two tiers, shutdown: a few minutes. ci-live.js
    # has its own 13-minute ceiling inside this one, so a hang is reported by
    # the tool, with the console log, rather than by the runner killing it.
    timeout-minutes: 15
    steps:
      # SECRETS ARE NOT AVAILABLE to pull requests from forks (or to Dependabot),
      # and a job-level `if` cannot read the secrets context. So the first step
      # looks, and every later step is gated on its answer. No key is a SKIP
      # with a notice, never a failure: a contributor cannot fix it.
      - name: Is the FiveM licence key available?
        id: key
        env:
          FIVEM_LICENSE_KEY: ${{ secrets.FIVEM_LICENSE_KEY }}
        run: |
          if [ -n "$FIVEM_LICENSE_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            msg="FIVEM_LICENSE_KEY is not available to this run (a fork PR, Dependabot, or the secret is not set), so the live server tier was SKIPPED. That is not a pass. To enable it see test/live/RUNBOOK.md, section CI."
            echo "::notice title=live server tier skipped::$msg"
            printf '### Live server tier: SKIPPED\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.key.outputs.present == 'true'
        with:
          node-version: '24'

      # Restore and save are separate on purpose: the combined action saves only
      # when the whole job succeeds, so a red run would download 70 MB again on
      # every retry. The key is the pinned build in tools/ci-fxserver.sh, so a
      # moved pin is a new cache entry and an old one is never reused.
      - name: Read the pinned FXServer build
        if: steps.key.outputs.present == 'true'
        id: pin
        run: |
          build="$(sed -n 's/^FXSERVER_BUILD="\${FXSERVER_BUILD:-\([0-9]*\)}"$/\1/p' tools/ci-fxserver.sh)"
          sha="$(sed -n 's/^FXSERVER_SHA256="\${FXSERVER_SHA256:-\([0-9a-f]*\)}"$/\1/p' tools/ci-fxserver.sh)"
          test -n "$build" && test -n "$sha"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "key=fxserver-linux-$build-$sha" >> "$GITHUB_OUTPUT"

      - name: Restore the FXServer artifact
        if: steps.key.outputs.present == 'true'
        id: fxcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/cis-fxserver/${{ steps.pin.outputs.build }}
          key: ${{ steps.pin.outputs.key }}

      - name: Download and verify FXServer ${{ steps.pin.outputs.build }}
        if: steps.key.outputs.present == 'true'
        # A cache hit is still checked for the stamp the script writes after the
        # sha256 comparison; a miss downloads, verifies and unpacks.
        run: bash tools/ci-fxserver.sh fetch

      - name: Save the FXServer artifact
        if: steps.key.outputs.present == 'true' && steps.fxcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/cis-fxserver/${{ steps.pin.outputs.build }}
          key: ${{ steps.pin.outputs.key }}

      - name: Boot FXServer and run the server and lifecycle tiers
        if: steps.key.outputs.present == 'true'
        # The key is in this step's environment and nowhere else. ci-live.js
        # writes it to a mode-0600 secrets.cfg outside the uploaded folder,
        # deletes it at shutdown, and redacts it from the console log.
        env:
          FIVEM_LICENSE_KEY: ${{ secrets.FIVEM_LICENSE_KEY }}
          CIS_CI_WORK: ${{ runner.temp }}/cis-ci-live
        run: bash tools/ci-fxserver.sh run --tiers server,lifecycle --timeout 780

      - name: Upload the console log and results
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: live-server-${{ github.run_id }}-${{ github.run_attempt }}
          # out/ only: console.log (ANSI stripped, key redacted), one results
          # file per tier, the generated server.cfg (no key in it), summary.json.
          path: ${{ runner.temp }}/cis-ci-live/out/
          if-no-files-found: warn
          retention-days: 14
