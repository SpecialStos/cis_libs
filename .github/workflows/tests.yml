name: tests

# Pure-Lua suites only. They run under fengari with no FiveM server and no
# game assets, so this is safe to run on every push.
#
# The integration harness (cis_libstest) needs a running fxserver and is NOT
# run here. It is gated separately, by hand, on a test instance.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit + binding + contracts + api contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Validate api.lua against the registered surface
        # api.lua is a contract, not a comment. The validator reads what the
        # resource actually registers -- names and parameter lists, out of the
        # source -- and fails on the difference.
        run: npm run test:api

      - name: Prove the api.lua validator still rejects drift
        # A validator that has only ever been seen to pass has not been tested.
        # This asserts the real manifest is clean AND that each deliberately
        # broken fixture in test/api/broken/ still fails with the diagnostic it
        # was built to trigger. Delete a fixture and this step fails.
        run: npm run test:api-selftest

      - name: Fail if the exports binding regresses
        # Guards the `self` trap documented at the top of init.lua.
        # A bracket-form export call shifts every argument one slot left and
        # silently corrupts the whole API. The pattern matches the CALL shape
        # (exports[..][..]( ) rather than a specific quote style, so a
        # regression written with double quotes is caught too. Comment lines are
        # excluded so the documentation of the trap does not trip its own
        # tripwire; test/binding.lua and test/contracts.lua are the real checks.
        run: |
          hits=$(grep -rnE 'exports\[[^]]+\]\[[^]]*\]\(' --include=*.lua . \
                 | grep -vE ':[[:space:]]*--' || true)
          if [ -n "$hits" ]; then
            echo "::error::Unbound exports call found. Pass the exports table as the first argument (see the header of the file that tripped it)."
            echo "$hits"
            exit 1
          fi
          echo "No unbound exports calls found."

      - name: No third-party host in the shipped source
        # The version check used to fire an outbound GET to a personal GitHub
        # Pages URL on every boot. The endpoint is config now, and this keeps it
        # that way: a hardcoded host in the source is a supply-chain risk, not a
        # feature. test/contracts.lua checks the same thing behaviourally.
        run: |
          hits=$(grep -rnE 'https?://[A-Za-z0-9.-]+\.(github\.io|githubusercontent\.com)' \
                 --include=*.lua . | grep -vE ':[[:space:]]*--' || true)
          if [ -n "$hits" ]; then
            echo "::error::Hardcoded third-party version host found in a Lua source file."
            echo "$hits"
            exit 1
          fi
          echo "No hardcoded third-party version hosts found."

      - name: Lua syntax check
        # WHY THIS STEP IS NOT A ONE-LINER
        #
        # FiveM's backtick hash literals (`` `WEAPON_UNARMED` ``) are valid in
        # the Cfx Lua runtime and a syntax error to stock luac, so those files
        # have to be recognised and skipped rather than failed.
        #
        # It was previously written as a `case` glob:
        #
        #     *"unexpected symbol near `'"*) echo "skip";;
        #
        # which is a BASH PARSE ERROR. The glob opens a double quote, and a
        # backtick inside double quotes is command substitution -- so bash
        # starts looking for a closing backtick, never finds one, and dies with
        # "unexpected EOF" and exit code 2 BEFORE IT PARSES A SINGLE FILE.
        #
        # That is why every run in this repository's history was red and every
        # run died on the same step, with no output to explain it. Nothing was
        # ever checked.
        #
        # The identification below uses grep with SINGLE-quoted patterns, where
        # a backtick is literal, and it requires BOTH that luac complained about
        # an unexpected symbol AND that the file actually contains a backtick
        # literal. A file with a genuine syntax error does not have one, so it
        # is still reported -- the skip is narrow on purpose.
        run: |
          status=0
          while IFS= read -r f; do
            if err=$(luac5.4 -p "$f" 2>&1); then
              :
            elif printf '%s' "$err" | grep -qF 'unexpected symbol near'                  && grep -qE '`[^`]+`' "$f"; then
              echo "skip (FiveM hash literal): $f"
            else
              echo "SYNTAX ERROR: $f"
              echo "$err"
              status=1
            fi
          done < <(find . -name '*.lua' -not -path './node_modules/*')
          exit $status
