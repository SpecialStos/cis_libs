name: tests

# Everything the repository gates on, in one script, so a local `npm run
# test:all` and this workflow cannot drift. If a step here is not reachable
# from that script, it is a step somebody has to remember to run.
#
# The mutation gate is the exception and runs in its own job, because it copies
# the tree and runs the suite once per mutation: minutes rather than seconds,
# which is too slow to sit in front of every push but too important to leave to
# a nightly nobody reads.

on:
  # Pushes to main only. A branch with a pull request is tested by the
  # pull_request event; listening to pushes on every branch as well ran the
  # whole gate twice for each commit on a PR branch.
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, so a FiveM release that changes the natives cannot sit unnoticed
    # until the next unrelated change happens to touch a native.
    - cron: '17 4 * * *'
  workflow_dispatch:

# Read-only token. Nothing in this workflow writes to the repository.
permissions:
  contents: read

# Superseded runs are cancelled rather than queued: ten pushes to a pull
# request should cost the last one, not all ten. Keyed on the PR number when
# there is one, so a PR's runs share a group whatever ref the event names.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # luacheck 1.2.0 exactly. The lint result is part of the release gate, so a
  # floating version means the gate means something different each month.
  LUACHECK_VERSION: 1.2.0

jobs:
  test:
    name: full gate (lint, realms, suites on two interpreters, api, generated files)
    # Pinned on purpose, and written as a literal: `runs-on` is evaluated
    # before the `env` context exists, so `${{ env.RUNNER }}` here is an
    # error and the workflow never starts. `ubuntu-latest` moved under this
    # file before, and a green run on two different images is not evidence
    # about either of them.
    runs-on: ubuntu-24.04
    steps:
      # v7 is the newest major of both actions (git ls-remote --tags, 2026-10).
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Lua 5.4
        # The suites run under BOTH fengari and a real interpreter. Task 1.7
        # found a seeded-RNG defect that only exists on a real one, so this is
        # a correctness gate rather than a belt-and-braces extra. With CI set,
        # test:lua54 FAILS when no interpreter is found instead of skipping.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          lua5.4 -v

      - name: Install luacheck
        # luarocks, not apt: the apt package tracks whatever Ubuntu ships, and
        # this repository's lint result is only meaningful at a known version.
        run: |
          sudo apt-get install -y -qq luarocks
          sudo luarocks install luacheck "$LUACHECK_VERSION"
          luacheck --version | head -1

      - name: Run the full gate
        # lint, generated-luacheck check, realm check, syntax, the suite under
        # fengari, the same suite under Lua 5.4, the api validator and its own
        # selftest, the generated-file check, docs, and the package build.
        run: npm run test:all

  mutate:
    name: mutation gate (every known defect must break the suite)
    runs-on: ubuntu-24.04
    # Not on every push: it copies the tree and runs the suite once per row.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply every mutation and require the suite to fail
        # A mutation that still passes is a SURVIVOR and means the check it was
        # written for does not exist. A row whose find no longer matches is
        # STALE and means it stopped testing anything. Both fail the build.
        run: npm run test:mutate
